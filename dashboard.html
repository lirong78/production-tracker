<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地刷车间产能达成看板</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #f0f2f5;
    padding: 20px;
    min-height: 100vh;
}
.container {
    max-width: 1400px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
}
.title {
    font-size: 28px;
    font-weight: 800;
    color: #1a237e;
    letter-spacing: 2px;
}
.title-icon { font-size: 32px; margin-right: 8px; vertical-align: middle; }
.date-picker {
    display: flex;
    align-items: center;
    gap: 12px;
}
.date-picker label {
    font-size: 14px;
    color: #666;
    font-weight: 500;
}
.date-picker input[type="date"] {
    padding: 10px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    color: #333;
    cursor: pointer;
    transition: all 0.2s;
}
.date-picker input[type="date"]:hover {
    border-color: #1a237e;
}
.date-picker input[type="date"]:focus {
    outline: none;
    border-color: #1a237e;
    box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.1);
}
.btn-today {
    padding: 10px 20px;
    background: #1a237e;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.btn-today:hover {
    background: #283593;
}
.subtitle {
    text-align: center;
    font-size: 15px;
    color: #666;
    margin-bottom: 20px;
}
.subtitle span {
    display: inline-block;
    background: #e8eaf6;
    color: #3f51b5;
    padding: 6px 16px;
    border-radius: 20px;
    margin: 0 4px;
    font-weight: 600;
    font-size: 14px;
}
.legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.legend-item {
    display: flex;
    align-items: center;
    font-size: 13px;
    color: #555;
    font-weight: 500;
}
.legend-color {
    width: 20px;
    height: 14px;
    border-radius: 4px;
    margin-right: 6px;
}
.loading {
    text-align: center;
    padding: 60px;
    color: #888;
    font-size: 16px;
}
.loading::after {
    content: "...";
    animation: dots 1.5s infinite;
}
@keyframes dots {
    0%, 20% { content: "."; }
    40% { content: ".."; }
    60%, 100% { content: "..."; }
}
table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 3px;
    font-size: 13px;
    margin-bottom: 24px;
    table-layout: fixed;
}
th {
    background: #1a237e;
    color: #fff;
    padding: 12px 8px;
    text-align: center;
    font-weight: 700;
    border-radius: 6px;
    font-size: 13px;
}
td {
    padding: 4px;
    text-align: center;
    vertical-align: middle;
    border-radius: 6px;
}
.rank-cell {
    padding: 8px 4px;
    border-radius: 8px;
    text-align: center;
    vertical-align: middle;
    font-weight: 900;
    font-size: 16px;
    min-width: 36px;
    width: 36px;
}
.line-cell {
    background: #f8f9fa;
    padding: 10px 6px;
    border-radius: 8px;
}
.line-name { font-weight: 800; color: #1a237e; font-size: 14px; }
.line-leader { font-size: 11px; color: #888; margin-top: 2px; }
.cell {
    padding: 8px 4px;
    border-radius: 6px;
    color: #fff;
    font-weight: 600;
    min-height: 50px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    line-height: 1.4;
}
.cell .model { font-size: 11px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cell .numbers { font-size: 12px; font-weight: 700; }
.cell .diff { font-size: 10px; opacity: 0.9; }
.cell-achieved { background: #4caf50; }
.cell-missed { background: #f44336; }
.cell-gray { background: #e0e0e0; color: #666; }
.cell-empty { background: #f5f5f5; color: #ccc; font-size: 11px; }
.summary-cell {
    background: #f8f9fa;
    padding: 8px 6px;
    border-radius: 8px;
}
.summary-total { font-weight: 800; color: #1a237e; font-size: 16px; }
.summary-target { font-size: 11px; color: #888; }
.summary-rate { font-size: 13px; font-weight: 700; margin-top: 2px; }
.rate-high { color: #4caf50; }
.rate-mid { color: #ff9800; }
.rate-low { color: #f44336; }
.summary-cards {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}
.summary-card {
    background: #fff;
    border: 2px solid #e8eaf6;
    border-radius: 12px;
    padding: 16px 28px;
    text-align: center;
    min-width: 140px;
}
.summary-card .card-label { font-size: 13px; color: #888; margin-bottom: 6px; font-weight: 500; }
.summary-card .card-value { font-size: 28px; font-weight: 800; color: #1a237e; }
.summary-card .card-value.green { color: #4caf50; }
.summary-card .card-value.red { color: #f44336; }
.summary-card .card-value.orange { color: #ff9800; }
.exception-section {
    padding: 20px;
    background: #fff8f8;
    border-radius: 12px;
    border: 2px solid #ffebee;
}
.exception-title {
    font-size: 16px;
    font-weight: 700;
    color: #c62828;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.exception-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.exception-item {
    background: #fff;
    padding: 12px 16px;
    border-radius: 8px;
    border-left: 4px solid #f44336;
}
.exception-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}
.exception-category {
    font-size: 14px;
    font-weight: 700;
    color: #c62828;
}
.exception-impact {
    font-size: 12px;
    color: #666;
    background: #ffebee;
    padding: 3px 10px;
    border-radius: 10px;
    font-weight: 600;
}
.exception-reasons {
    font-size: 12px;
    color: #666;
    line-height: 1.5;
}
.no-data {
    text-align: center;
    padding: 40px;
    color: #888;
    font-size: 15px;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title"><span class="title-icon">📊</span>地刷车间产能达成看板</div>
        <div class="date-picker">
            <label>选择日期：</label>
            <input type="date" id="dateInput">
            <button class="btn-today" onclick="setToday()">今天</button>
        </div>
    </div>
    
    <div id="content">
        <div class="loading">加载中</div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://jtcoqlpxdubcmdpawyiu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g9LTQJUkOYi2F0AU8wmPbw_Gb-kxdI_';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TIME_SLOTS = [
    '8:00~9:00', '9:00~10:00', '10:00~11:00', '11:00~12:00',
    '12:00~13:00', '13:00~14:00', '14:00~15:00', '15:00~16:00',
    '16:00~17:00', '17:00~18:00', '18:00~19:00', '19:00~20:00'
];

const LINES = [
    { name: '地刷1线', leader: '孟飞' },
    { name: '地刷2线', leader: '李林' },
    { name: '水箱1线', leader: '金娟' },
    { name: '水箱2线', leader: '马怡军' },
    { name: '充电座', leader: '张林' }
];

const NON_TARGET_CATEGORIES = ['试制试产', '返工', '支援'];

// 初始化日期为今天
function initDate() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').value = today;
    loadData(today);
}

function setToday() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').value = today;
    loadData(today);
}

// 监听日期变化
document.getElementById('dateInput').addEventListener('change', (e) => {
    loadData(e.target.value);
});

// 获取星期几
function getWeekday(dateStr) {
    const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const date = new Date(dateStr);
    return days[date.getDay()];
}

// 格式化日期显示
function formatDate(dateStr) {
    const d = new Date(dateStr);
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}

// 加载数据
async function loadData(dateStr) {
    document.getElementById('content').innerHTML = '<div class="loading">加载中</div>';
    
    try {
        const { data, error } = await supabase
            .from('production_records')
            .select('*')
            .eq('record_date', dateStr)
            .order('line_name')
            .order('hour_slot');
        
        if (error) throw error;
        
        renderDashboard(dateStr, data || []);
    } catch (err) {
        document.getElementById('content').innerHTML = `<div class="no-data">加载失败：${err.message}</div>`;
    }
}

// 渲染看板
function renderDashboard(dateStr, records) {
    // 按线体分组
    const lineData = {};
    LINES.forEach(line => {
        lineData[line.name] = {
            info: line,
            hours: {},
            totalTarget: 0,
            totalAchieved: 0,
            exceptions: []
        };
    });
    
    // 填充数据
    records.forEach(r => {
        const lineName = r.line_name;
        if (!lineData[lineName]) return;
        
        const hour = r.hour_slot;
        const isNonTarget = NON_TARGET_CATEGORIES.includes(r.reason_category);
        
        lineData[lineName].hours[hour] = {
            model: r.model_name || '',
            target: isNonTarget ? 0 : (r.target_value || 0),
            achieved: r.achieved_value || 0,
            reason: r.reason || '',
            reasonCategory: r.reason_category || '',
            isNonTarget: isNonTarget
        };
        
        if (!isNonTarget) {
            lineData[lineName].totalTarget += (r.target_value || 0);
        }
        lineData[lineName].totalAchieved += (r.achieved_value || 0);
        
        if (r.reason_category && r.reason_category !== '其他' && !isNonTarget) {
            lineData[lineName].exceptions.push({
                hour: hour,
                category: r.reason_category,
                reason: r.reason,
                impact: (r.target_value || 0) - (r.achieved_value || 0)
            });
        }
    });
    
    // 计算达成率并排序
    const lineList = Object.values(lineData).map(line => {
        line.rate = line.totalTarget > 0 ? (line.totalAchieved / line.totalTarget * 100) : 0;
        return line;
    }).sort((a, b) => b.rate - a.rate);
    
    // 计算汇总
    let totalTarget = 0, totalAchieved = 0, achievedHours = 0, missedHours = 0;
    lineList.forEach(line => {
        totalTarget += line.totalTarget;
        totalAchieved += line.totalAchieved;
        TIME_SLOTS.forEach(slot => {
            const h = line.hours[slot];
            if (h && !h.isNonTarget) {
                if (h.achieved >= h.target && h.target > 0) achievedHours++;
                else if (h.target > 0 && h.achieved < h.target) missedHours++;
            }
        });
    });
    
    const totalRate = totalTarget > 0 ? (totalAchieved / totalTarget * 100) : 0;
    const diff = totalAchieved - totalTarget;
    
    // 收集所有异常
    const allExceptions = [];
    lineList.forEach(line => {
        line.exceptions.forEach(ex => {
            allExceptions.push({ ...ex, lineName: line.info.name });
        });
    });
    allExceptions.sort((a, b) => b.impact - a.impact);
    const topExceptions = allExceptions.slice(0, 5);
    
    // 生成HTML
    let html = `
        <div class="subtitle">
            <span>${formatDate(dateStr)}</span>
            <span>${getWeekday(dateStr)}</span>
            <span>地刷车间</span>
        </div>
        
        <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background:#4caf50"></div>达成</div>
            <div class="legend-item"><div class="legend-color" style="background:#f44336"></div>未达成</div>
            <div class="legend-item"><div class="legend-color" style="background:#e0e0e0"></div>休息/支援/返工/试制试产</div>
            <div class="legend-item"><div class="legend-color" style="background:#f5f5f5;border:1px solid #ddd"></div>未录入</div>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th style="width:40px">排名</th>
                    <th style="width:80px">线体</th>
                    ${TIME_SLOTS.map(s => `<th>${s}</th>`).join('')}
                    <th style="width:90px">今日汇总</th>
                </tr>
            </thead>
            <tbody>
    `;
    
    // 渲染每行
    lineList.forEach((line, idx) => {
        const rank = idx + 1;
        let rankBg = '#f0f0f0';
        let rankColor = '#666';
        if (rank === 1) { rankBg = 'linear-gradient(135deg, #ffd700, #ffed4e)'; rankColor = '#333'; }
        else if (rank === 2) { rankBg = 'linear-gradient(135deg, #c0c0c0, #e8e8e8)'; rankColor = '#333'; }
        else if (rank === 3) { rankBg = 'linear-gradient(135deg, #cd7f32, #e8a87c)'; rankColor = '#fff'; }
        
        html += `<tr>
            <td class="rank-cell" style="background:${rankBg};color:${rankColor}">${rank}</td>
            <td class="line-cell">
                <div class="line-name">${line.info.name}</div>
                <div class="line-leader">班长：${line.info.leader}</div>
            </td>`;
        
        TIME_SLOTS.forEach(slot => {
            const h = line.hours[slot];
            if (!h) {
                html += `<td><div class="cell cell-empty">未录入</div></td>`;
            } else if (h.isNonTarget) {
                html += `<td><div class="cell cell-gray"><div class="model">${h.reasonCategory}</div></div></td>`;
            } else if (h.target === 0 && h.achieved === 0) {
                html += `<td><div class="cell cell-empty">未录入</div></td>`;
            } else {
                const isAchieved = h.achieved >= h.target;
                const cellClass = isAchieved ? 'cell-achieved' : 'cell-missed';
                const diffVal = h.achieved - h.target;
                const diffStr = diffVal >= 0 ? `+${diffVal}` : `${diffVal}`;
                html += `<td><div class="cell ${cellClass}">
                    <div class="model">${h.model || '-'}</div>
                    <div class="numbers">${h.achieved}/${h.target}</div>
                    <div class="diff">${diffStr}</div>
                </div></td>`;
            }
        });
        
        const rateClass = line.rate >= 100 ? 'rate-high' : (line.rate >= 90 ? 'rate-mid' : 'rate-low');
        const lineDiff = line.totalAchieved - line.totalTarget;
        const lineDiffStr = lineDiff >= 0 ? `+${lineDiff}` : `${lineDiff}`;
        
        html += `<td class="summary-cell">
            <div class="summary-total">${line.totalAchieved}</div>
            <div class="summary-target">目标${line.totalTarget}</div>
            <div class="summary-rate ${rateClass}">${line.rate.toFixed(1)}%</div>
        </td></tr>`;
    });
    
    html += `</tbody></table>`;
    
    // 汇总卡片
    const totalRateClass = totalRate >= 100 ? 'green' : (totalRate >= 90 ? 'orange' : 'red');
    const diffClass = diff >= 0 ? 'green' : 'red';
    const diffDisplay = diff >= 0 ? `+${diff}` : `${diff}`;
    
    html += `
        <div class="summary-cards">
            <div class="summary-card">
                <div class="card-label">今日总目标</div>
                <div class="card-value">${totalTarget} 台</div>
            </div>
            <div class="summary-card">
                <div class="card-label">今日总达成</div>
                <div class="card-value ${totalRateClass}">${totalAchieved} 台</div>
            </div>
            <div class="summary-card">
                <div class="card-label">达成率</div>
                <div class="card-value ${totalRateClass}">${totalRate.toFixed(1)}%</div>
            </div>
            <div class="summary-card">
                <div class="card-label">超产/欠产</div>
                <div class="card-value ${diffClass}">${diffDisplay}</div>
            </div>
            <div class="summary-card">
                <div class="card-label">达成/未达成时段</div>
                <div class="card-value"><span style="color:#4caf50">${achievedHours}</span> / <span style="color:#f44336">${missedHours}</span></div>
            </div>
        </div>
    `;
    
    // 异常部分
    html += `<div class="exception-section">
        <div class="exception-title">
            <span>⚠️</span>
            <span>当日主要异常（影响最大的前5条）</span>
        </div>
        <div class="exception-list">`;
    
    if (topExceptions.length === 0) {
        html += `<div class="exception-item"><div class="exception-reasons">今日无异常记录</div></div>`;
    } else {
        topExceptions.forEach(ex => {
            html += `<div class="exception-item">
                <div class="exception-header">
                    <span class="exception-category">${ex.lineName} - ${ex.category}</span>
                    <span class="exception-impact">影响 ${ex.impact} 台 (${ex.hour})</span>
                </div>
                ${ex.reason ? `<div class="exception-reasons">${ex.reason}</div>` : ''}
            </div>`;
        });
    }
    
    html += `</div></div>`;
    
    document.getElementById('content').innerHTML = html;
}

// 初始化
initDate();
</script>
</body>
</html>
